[project]
name = "ai-logistics-analytics"
version = "0.1.0"
description = "AI-powered logistics analytics dashboard MVP"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.13",
    "fastapi>=0.116,<1",
    "langchain-openai>=1.0",
    "langdetect>=1.0.9",
    "langfuse>=4.15,<5",
    "openai>=1.60,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=0.28",
    "pytest>=8.4,<9",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
