name: CI

on:
  # Pull-request branches are covered by the pull_request event; without this
  # filter every push to a PR branch ran the whole workflow twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The dependency tree is large (deepagents pulls in langchain, anthropic,
      # google-genai, ...). Compiling bytecode at install time is parallel and
      # lands inside the cached .venv; leaving it to import time is serial and
      # is paid again on every run - that was the bulk of the test step.
      UV_COMPILE_BYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # CI tests use scripted models and fake Langfuse clients where tracing
      # behavior is covered. Never let a real exporter retry a network call
      # and hold the backend job until its workflow timeout.
      LANGFUSE_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache backend virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-3.11-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          # A stale venv is still worth restoring: uv sync reconciles it to the
          # lock file and the compiled bytecode of everything unchanged is kept.
          restore-keys: |
            ${{ runner.os }}-python-3.11-uv-

      - name: Install backend dependencies
        run: uv sync --locked --no-install-project

      - name: Run backend unit tests
        # --durations keeps the cost of the suite visible in the log, so a slow
        # test is attributable instead of hiding inside the step total.
        run: uv run --no-sync pytest -q --durations=15 -p no:cacheprovider

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test
